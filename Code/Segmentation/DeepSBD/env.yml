name: deepsbd_env
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.9
  - numpy
  - opencv
  - scikit-learn
  - joblib
  - matplotlib
  - tqdm

  # PyTorch GPU
  - pytorch=2.1
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8

  # Utils
  - pip
  - pip:
      - tensorboard
